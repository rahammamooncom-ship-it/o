<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Image Maker</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 40px 20px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    p {
      color: #9ca3af;
    }

    textarea {
      width: 100%;
      height: 120px;
      box-sizing: border-box;
      padding: 15px;
      margin-top: 25px;
      border: 1px solid #374151;
      border-radius: 12px;
      background: #1f2937;
      color: white;
      font-size: 16px;
      resize: none;
    }

    button {
      margin-top: 20px;
      padding: 14px 30px;
      border: none;
      border-radius: 10px;
      background: #7c3aed;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #6d28d9;
    }

    #result {
      margin-top: 30px;
      padding: 25px;
      border-radius: 15px;
      background: #1f2937;
      min-height: 100px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>✨ AI Image Maker</h1>

    <p>Turn your ideas into images.</p>

    <textarea id="prompt"
      placeholder="Describe the image you want..."></textarea>

    <br>

    <button onclick="generateImage()">
      Generate Image
    </button>

    <div id="result">
      Your generated image will appear here.
    </div>

  </div>

  <script>
    function generateImage() {
      const prompt = document.getElementById("prompt").value;
      const result = document.getElementById("result");

      if (prompt.trim() === "") {
        result.innerHTML = "⚠️ Please enter an image description.";
        return;
      }

      result.innerHTML =
        "🎨 Creating your image...<br><br>" +
        "Prompt: " + prompt;
    }
  </script>

</body>
  </html>
